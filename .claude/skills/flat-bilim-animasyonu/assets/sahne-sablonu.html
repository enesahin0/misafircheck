<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!--
  SAHNE ŞABLONU — scripts/render.py ile render edilir.
  KURALLAR
  • t=0 bu sahnenin başlangıcıdır. animation-delay = sahne içindeki saniye.
  • Sahne süresi render sırasında var(--sure) ve window.SAHNE_SURESI olarak gelir
    (tarayıcıda doğrudan açarsan varsayılan 6s kullanılır).
  • Idle döngüler için NEGATİF delay kullan (animasyon t=0'da zaten "ortasında" olsun).
  • Olaylar (pop-in, kayma) için POZİTİF delay + "both" fill-mode kullan.
  • Her id benzersiz olsun (gradyan ile öğe aynı id’yi paylaşırsa JS yanlış öğeyi bulur).
  • Harici kaynak yok: font, görsel, script hepsi dosyanın içinde.
  • Bu dosyada: kamera push-in, idle süzülme, yıldız titreşimi, zamanlı pop-in başlık,
    renderAt ile sayaç ve ışık huzmesi örnekleri var. Kopyala, gerekmeyeni sil.
-->
<style>
  :root { --sure: 6s; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0B1433; }
  svg { display: block; }
  text { font-family: "Noto Sans CJK JP", "DejaVu Sans", sans-serif; font-weight: 900; }

  /* Kamera: sahne boyunca yavaş push-in (sahnenin tamamına yayılır) */
  #kamera { transform-origin: 960px 540px; animation: pushIn var(--sure) cubic-bezier(.45,0,.55,1) both; }
  @keyframes pushIn { from { transform: scale(1) } to { transform: scale(1.07) } }

  /* Idle döngüler */
  .float   { animation: float 5s cubic-bezier(.45,0,.55,1) -1.3s infinite alternate; }
  .twinkle { animation: twinkle 2.6s ease-in-out infinite alternate; }
  .pulse   { animation: pulse 3.5s ease-in-out -.8s infinite alternate; transform-box: fill-box; transform-origin: center; }
  .spin    { animation: spin 60s linear infinite; }
  @keyframes float   { from { transform: translateY(-8px) } to { transform: translateY(8px) } }
  @keyframes twinkle { from { opacity: .3 } to { opacity: 1 } }
  @keyframes pulse   { from { opacity: .7; transform: scale(.97) } to { opacity: 1; transform: scale(1.03) } }
  @keyframes spin    { to { transform: rotate(360deg) } }

  /* Olaylar: pozitif delay = anlatımdaki anahtar kelimenin saniyesi */
  .popIn  { animation: popIn .55s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
  .fadeUp { animation: fadeUp .6s cubic-bezier(.22,1,.36,1) both; }
  .popOut { animation: popOut .35s cubic-bezier(.55,0,1,.45) both; transform-box: fill-box; transform-origin: center; }
  @keyframes popIn  { from { transform: scale(0) } to { transform: scale(1) } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: none } }
  @keyframes popOut { from { transform: scale(1) } to { transform: scale(0) } }
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1433"/><stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="gunesGlow">
      <stop offset="0" stop-color="#FFB547" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#FF8A3D" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="atmosfer">
      <stop offset=".78" stop-color="#3CD6F0" stop-opacity="0"/>
      <stop offset=".86" stop-color="#3CD6F0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3CD6F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#050A1C" stop-opacity="0"/>
      <stop offset="1" stop-color="#050A1C" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="huzme" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity=".9"/>
    </linearGradient>
    <clipPath id="gezegenKes"><circle cx="560" cy="620" r="240"/></clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#gok)"/>

  <g id="kamera">
    <!-- Yıldızlar -->
    <g fill="#FFF3D6">
      <circle class="twinkle" cx="140" cy="120" r="2" style="animation-delay:-.4s"/>
      <circle class="twinkle" cx="520" cy="90" r="2.5" style="animation-delay:-2s"/>
      <circle class="twinkle" cx="1180" cy="160" r="1.5" style="animation-delay:-.8s"/>
      <circle class="twinkle" cx="1320" cy="420" r="2" style="animation-delay:-1.6s"/>
      <circle class="twinkle" cx="1760" cy="860" r="2" style="animation-delay:-2.4s"/>
      <circle class="twinkle" cx="90" cy="760" r="2" style="animation-delay:-1.9s"/>
      <circle class="twinkle" cx="1120" cy="980" r="1.5" style="animation-delay:-1s"/>
      <circle class="twinkle" cx="960" cy="60" r="2" style="animation-delay:-.6s"/>
    </g>

    <!-- Güneş (ışık kaynağı, sağ üst) -->
    <g transform="translate(1620 260)">
      <circle class="pulse" r="330" fill="url(#gunesGlow)"/>
      <circle r="100" fill="#FFB547"/><circle r="72" fill="#FFD98A"/>
    </g>

    <!-- Işık huzmesi: renderAt ile güneşten Dünya'ya ilerler -->
    <g transform="translate(1540 300) rotate(-21.2)"><rect id="isikHuzmesi" x="0" y="-8" height="16" rx="8" width="0" fill="url(#huzme)"/></g>

    <!-- Gezegen (odak) — rim light tekniği: kırpma içinde rim rengi + kaydırılmış gövde -->
    <g class="float">
      <circle cx="560" cy="620" r="280" fill="url(#atmosfer)"/>
      <g clip-path="url(#gezegenKes)">
        <circle cx="560" cy="620" r="240" fill="#FFE2A8"/>
        <circle cx="548" cy="632" r="240" fill="#2F7FD0"/>
        <path d="M420 520 q50 -60 125 -25 q60 25 35 85 q-25 60 -100 42 q-75 -17 -60 -102z" fill="#5BC98B"/>
        <path d="M600 660 q60 -34 110 8 q42 42 0 92 q-50 50 -110 17 q-50 -34 0 -117z" fill="#5BC98B"/>
        <circle cx="400" cy="780" r="270" fill="#1E1B4B" opacity=".55"/>
      </g>
    </g>

    <!-- Olay: başlık, anlatımda ilgili kelimenin söylendiği saniyede belirir -->
    <g class="fadeUp" style="animation-delay:1.2s">
      <text x="1340" y="800" font-size="96" fill="#FFF3D6" text-anchor="middle" id="sayac">0:00</text>
      <text x="1340" y="860" font-size="36" fill="#3CD6F0" text-anchor="middle" font-weight="700">dakika : saniye</text>
    </g>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>

<script>
  // JS ile sürülen öğeler: render.py her karede renderAt(t) çağırır.
  // Tarayıcıda doğrudan açınca da çalışsın diye requestAnimationFrame yedeği var.
  const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;   // easeInOutCubic
  const aralik = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));

  window.renderAt = function (t) {
    // Sayaç: 1.2 sn'de başlar, 3.5 sn'de 8:20'ye ulaşır
    const k = ease(aralik(t, 1.2, 3.5));
    const toplam = Math.round(500 * k);
    document.getElementById('sayac').textContent =
      Math.floor(toplam / 60) + ':' + String(toplam % 60).padStart(2, '0');
    // Huzme: 0.3 → 2.5 sn arasında güneşten gezegene uzanır (döndürülmüş grup içinde sola doğru büyür)
    const h = ease(aralik(t, 0.3, 2.5));
    const huzme = document.getElementById('isikHuzmesi');
    huzme.setAttribute('width', 740 * h);
    huzme.setAttribute('x', -740 * h);
  };

  if (!navigator.webdriver) {           // sadece normal tarayıcı önizlemesinde
    const t0 = performance.now();
    (function dongu() { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(dongu); })();
  }
</script>
</body>
</html>
