<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="zemin"></g><g class="kamera"><g id="dinamik"></g></g>
</svg>
<script>window.SB = 0;
window.KANAL = { kategori: 'MASKOT TESTİ', renk: '#FBAC39', sesSonu: 60 };
window.CAP = [[0.3,2.3,'Göz kırpma + *nefes*'],[2.4,4.4,'Birbirlerine *bakıyorlar*'],[4.5,7.4,'Gözler *hedefi takip* ediyor'],[7.5,9.3,'Tepki: *şaşırma*'],[9.4,10.9,'Gubi: *aha!*'],[11.0,12.5,'Gufi: *sevinç*'],[12.6,14.2,'Gufi: *korku*, Gubi: *üzgün*'],[14.3,16.2,'Gufi: *zıplama*, Gubi: *kararlı*'],[16.3,18.4,'Ve... *selam!*']];
</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script>
<script>
const $ = i => document.getElementById(i), A = K.aralik, E = K.ease;
const GB = [340, 960], GF = [740, 1120];
$('zemin').innerHTML = `<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1433"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#bg)"/>`
  + K.glow({ x: 540, y: 950, r: 620, renk: '#7B61FF', guc: .22 }) + K.yildizlar({ adet: 60, seed: 4, renk: '#FFF3D6', alan: [0, 0, 1080, 1920] })
  + `<ellipse cx="540" cy="1135" rx="470" ry="46" fill="#2E3A7A" opacity=".55"/>`;
const TG = [[7.5,'sasir'],[9.4,'aha'],[12.6,'uzgun'],[14.3,'kararli'],[16.3,'selam'],[17.2,'mutlu']];
const TF = [[7.62,'sasir'],[9.9,'sasir'],[11.0,'mutlu'],[12.6,'korku'],[14.3,'zipla'],[15.1,'zipla'],[16.45,'selam'],[17.3,'mutlu']];
const karis = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
window.renderAt = t => {
  // hedef nesne: 4.5–7.4 arası ekranda dolanan minik ışık küresi
  const orbOp = A(t, 4.5, 4.9) * (1 - A(t, 7.3, 7.5));
  const u = (t - 4.5) * 1.6, orb = [540 + Math.cos(u) * 330, 640 + Math.sin(u * 1.4) * 140];
  const kam = [540, 2600]; // izleyiciye bakış (hafif aşağı-öne)
  let hG = kam, hF = kam;
  if (t > 2.4 && t < 4.5) { const k = E(A(t, 2.4, 2.8)); hG = karis(kam, [GF[0], GF[1] - 90], k); hF = karis(kam, GB, k); }
  if (t >= 4.5 && t < 7.5) { const k = E(A(t, 4.5, 4.8)); hG = karis([GF[0], GF[1] - 90], orb, k); hF = karis(GB, orb, k); }
  if (t >= 7.5 && t < 9.4) { hG = orb; hF = orb; }
  if (t >= 9.4 && t < 11) { hF = GB; hG = [540, 400]; }       // Gufi Gubi'ye bakar, Gubi fikre (yukarı)
  if (t >= 11 && t < 12.6) { hG = [GF[0], GF[1] - 90]; hF = GB; }
  if (t >= 12.6 && t < 14.3) { hG = [GF[0], GF[1] - 90]; hF = [1200, 700]; }
  let o = '';
  if (orbOp > 0) o += `<g opacity="${orbOp}">` + K.glow({ x: orb[0], y: orb[1], r: 90, renk: '#3CD6F0', guc: .8 }) + `<circle cx="${orb[0]}" cy="${orb[1]}" r="22" fill="#E8FBFF"/></g>`;
  const patla = A(t, 7.4, 7.9); if (patla > 0 && patla < 1) for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28, r = 30 + 160 * E(patla); o += `<circle cx="${orb[0] + Math.cos(a) * r}" cy="${orb[1] + Math.sin(a) * r}" r="${9 * (1 - patla)}" fill="#3CD6F0"/>`; }
  o += M.canli('gufi', { t, x: GF[0], y: GF[1], boy: 210, bakHedef: hF, tepkiler: TF });
  o += M.canli('gubi', { t, x: GB[0], y: GB[1], boy: 240, bakHedef: hG, tepkiler: TG });
  $('dinamik').innerHTML = o;
};
</script>
<script src="../ortak/kanal.js"></script>
</body></html>
