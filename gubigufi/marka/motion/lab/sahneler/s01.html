<script>window.SB = 0; const TP = {"gubi": [[1.0, "sasir"]], "gufi": []}; window.GECIS = {"gir": null, "cik": {"tur": "yildiz", "renk": "#FBAC39", "merkez": [540, 820]}};</script>

<script src="../ortak/vendor/flubber.min.js"></script><script src="../ortak/vendor/culori.js"></script><script src="../ortak/motion2.js"></script><script src="../ortak/logo_paths.js"></script><script src="../ortak/altyazi.js"></script>
<script>
const $ = i => document.getElementById(i), A = K.aralik, E = q => q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => back(A(t, a, a + d));
const grp = (s, x, y, k = 1, r = 0, op = 1) => `<g transform="translate(${x} ${y}) scale(${k}) rotate(${r})" opacity="${op}">${s}</g>`;
const olc = (s, x, y, k) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900, ek = '') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}" ${ek}>${s}</text>`;
const cip = (s, x, y, renk, yazi = '#0B1433', fs = 38) => { const w = K.yaziGen(s, fs, { mono: true, ls: 3 }) + fs * 1.7; return `<rect x="${x - w / 2}" y="${y - fs * 1.2}" width="${w}" height="${fs * 2.2}" rx="${fs * 1.1}" fill="${renk}"/><text class="mono" x="${x}" y="${y + fs * .36}" font-size="${fs}" text-anchor="middle" letter-spacing="3" style="fill:${yazi}">${s}</text>`; };
const gubi = (t, o) => M.canli('gubi', Object.assign({ t, tepkiler: TP.gubi }, o));
const gufi = (t, o) => M.canli('gufi', Object.assign({ t, tepkiler: TP.gufi }, o));

const R = PR.R;
const kart = (w, h, renk) => R(-w / 2, -h / 2, w, h, 36, '#FFF8EE') + R(-w / 2, -h / 2, w, 70, 36, renk) + R(-w / 2, -h / 2 + 40, w, 30, 0, renk);

MO.sahne({
  zemin: MO.zemin({ ust: '#1A2A50', alt: '#0B1428', isik: [540, 1500, '#3E6FB8', .35], ikinci: [200, 400, '#FBAC39', .12] }),
  kamera: [[0, 1.0, 540, 900], [1.6, 1.28, 540, 700, 1.0]],
  ciz: t => {
    let o = '';
    o += MO.sayiVurgu(t, .3, 1.6, 1277, 540, 640, { boyut: 170 });
    const alt = MO.oge(t, { gir: .5, agirlik: 'hafif', giris: 'yuksel', x: 540, materyal: 'plastik' });
    o += MO.sar(cip('SU BASKINI İHBARI', 0, 0, '#7FD0FF', '#0B1433', 28), alt, 540, 760);
    const k = MO.oge(t, { gir: 2.1, agirlik: 'agir', giris: 'dus', x: 540, materyal: 'plastik', bekle: 2 });
    o += MO.sar(kart(520, 300, '#2E78C8') + txt('DASK', 0, 40, 96, '#1B2440'), k, 540, 1020);
    o += gubi(t, { x: 880, y: 1600, boy: 120, duygu: 'merak', bakHedef: [540, 800] });
    return o;
  }
});
</script>
