<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="kamYak"><g id="zemin"></g><g class="kamera"><g id="sabit"></g><g id="dinamik"></g></g></g>
</svg>
<script>window.SB = 6.97; const TP = {"gubi": [[9.2, "aha"]], "gufi": [[4.9, "sasir"]]};</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/zemin.js"></script><script src="../ortak/hareket.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/detay.js"></script><script src="../ortak/au.js"></script><script src="../ortak/al.js"></script><script src="../ortak/gv.js"></script>
<script src="../ortak/harita/d3-array.min.js"></script><script src="../ortak/harita/d3-geo.min.js"></script><script src="../ortak/harita/topojson-client.min.js"></script><script src="../ortak/harita/dunya50.js"></script><script src="../ortak/harita/ulke_tablo.js"></script><script src="../ortak/harita/turkiye10.js"></script><script src="../ortak/harita/harita.js"></script>
<script src="../ortak/logo_paths.js"></script><script src="../ortak/altyazi.js"></script>
<script>
const $ = i => document.getElementById(i), A = K.aralik, E = q => q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => back(A(t, a, a + d));
const grp = (s, x, y, k = 1, r = 0, op = 1) => `<g transform="translate(${x} ${y}) scale(${k}) rotate(${r})" opacity="${op}">${s}</g>`;
const olc = (s, x, y, k) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900, ek = '') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}" ${ek}>${s}</text>`;
const cip = (s, x, y, renk, yazi = '#0B1433', fs = 38) => { const w = K.yaziGen(s, fs, { mono: true, ls: 3 }) + fs * 1.7; return `<rect x="${x - w / 2}" y="${y - fs * 1.2}" width="${w}" height="${fs * 2.2}" rx="${fs * 1.1}" fill="${renk}"/><text class="mono" x="${x}" y="${y + fs * .36}" font-size="${fs}" text-anchor="middle" letter-spacing="3" style="fill:${yazi}">${s}</text>`; };
const gubi = (t, o) => M.canli('gubi', Object.assign({ t, tepkiler: TP.gubi }, o));
const gufi = (t, o) => M.canli('gufi', Object.assign({ t, tepkiler: TP.gufi }, o));

const R = PR.R, h = HK.hash, C = AU.C;
const BILGE = KO.giy('gubi', ['gozluk']);
const KAMERACI = KO.giy('gubi', [['kasket', { renk: '#2A2E40', siper: '#1B1F2A' }]]);
const REHBER = KO.giy('gubi', [['papyon', { renk: '#E8505B' }], 'gozluk']);
const BILIMCI = KO.giy('gubi', ['gozluk', ['papyon', { renk: '#4A8AD8' }]]);
const kam = (s, { x = 540, y = 900, k = 1, dx = 0, dy = 0 } = {}) => `<g transform="translate(${dx} ${dy}) translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;

window.renderAt = t => {
  let o = `<rect width="1080" height="1920" fill="#1B2440"/>`;
  for (let i = 0; i < 20; i++) o += AU.R(i * 60, 300, 2, 1000, 0, '#FFFFFF', .12) + AU.R(0, 300 + i * 60, 1080, 2, 0, '#FFFFFF', .12);
  o += AU.R(0, 1160, 1080, 760, 0, '#2A3456');
  const s = 2.0, Y = 1150, gx = 230 + 26 * t, H0 = 230 + 78 * s + 20;
  const hx = H0 + 70 * E(A(t, 4.87, 5.45)) + 70 * E(A(t, 9.13, 9.7)) - 70 * (1 - E(A(t, 0, .6))) * 0;
  const hy = Y - 150 * s;
  // hayalet (önceki) baş konumları
  [[H0, 0], [H0 + 70, 5.45]].forEach(([x, t0]) => { if (t > t0 + .6) o += `<circle cx="${x}" cy="${hy}" r="${26 * s}" fill="#FFFFFF" opacity=".08"/>`; });
  const tut = (t > 1.4 && t < 4.87) || (t > 5.5 && t < 9.13) || t > 9.7;
  if (tut) { o += `<path d="M${hx + 4 * s} 380 V${Y}" stroke="${C.ALT}" stroke-width="5" stroke-dasharray="16 10"/>` + `<g transform="translate(${hx + 4 * s} 420)">` + AU.R(-26, -10, 52, 40, 8, C.ALT) + `<path d="M-14 -10 v-12 a14 14 0 0 1 28 0 v12" stroke="${C.ALT}" stroke-width="7" fill="none"/>` + '</g>' + AU.cip('BAŞ SABİT', hx + 4 * s, 500, C.ALT, C.LAC, 28); }
  o += GV.guvercin(gx, Y, s, { basX: hx, adim: t * .45 });
  // gövde ok (sürekli ilerliyor)
  o += `<path d="M${gx - 120} ${Y + 60} H${gx + 40}" stroke="#7CFFB2" stroke-width="8" stroke-linecap="round"/><path d="M${gx + 40} ${Y + 44} l22 16 l-22 16" fill="#7CFFB2"/>` + AU.Tm('GÖVDE', gx - 40, Y + 110, 28, '#7CFFB2');
  const th = A(t, 4.87, 6.6); if (th > 0 && th < 1) { const x0 = H0 + 4 * s, x1 = H0 + 74 + 4 * s; o += `<g opacity="${Math.sin(th * Math.PI)}"><path d="M${x0} ${hy - 90} H${x1}" stroke="#FFFFFF" stroke-width="6"/><path d="M${x0} ${hy - 110} v40 M${x1} ${hy - 110} v40" stroke="#FFFFFF" stroke-width="6"/>` + AU.cip('≈ 5 cm', (x0 + x1) / 2, hy - 150, '#FFFFFF', C.LAC, 30) + '</g>'; }
  o += AU.cip('AĞIR ÇEKİM · 0,25×', 540, 400, C.KIR, '#FFFFFF', 30);
  o += gubi(t, { x: 260, y: 1600, boy: 180, ust: KAMERACI, duygu: 'kararli', bakHedef: [hx, hy] }) + GV.kamera(370, 1560, .9, Math.floor(t * 2) % 2);
  o += gufi(t, { x: 840, y: 1740, boy: 250, duygu: t > 4.9 && t < 6.5 ? 'sasir' : 'merak', bakHedef: [hx, hy] });
  $('dinamik').innerHTML = o;
};
</script>
<script src="../ortak/kanal.js"></script>
</body></html>
