<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="kamYak"><g id="zemin"></g><g class="kamera"><g id="sabit"></g><g id="dinamik"></g></g></g>
</svg>
<script>window.SB = 52.23; const TP = {"gubi": [[3.1, "sasir"], [9.8, "sasir"]], "gufi": [[1.0, "mutlu"], [8.4, "selam"]]};</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/zemin.js"></script><script src="../ortak/hareket.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/detay.js"></script><script src="../ortak/au.js"></script><script src="../ortak/al.js"></script>
<script src="../ortak/harita/d3-array.min.js"></script><script src="../ortak/harita/d3-geo.min.js"></script><script src="../ortak/harita/topojson-client.min.js"></script><script src="../ortak/harita/dunya50.js"></script><script src="../ortak/harita/ulke_tablo.js"></script><script src="../ortak/harita/turkiye10.js"></script><script src="../ortak/harita/harita.js"></script>
<script src="../ortak/logo_paths.js"></script><script src="../ortak/altyazi.js"></script>
<script>
const $ = i => document.getElementById(i), A = K.aralik, E = q => q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => back(A(t, a, a + d));
const grp = (s, x, y, k = 1, r = 0, op = 1) => `<g transform="translate(${x} ${y}) scale(${k}) rotate(${r})" opacity="${op}">${s}</g>`;
const olc = (s, x, y, k) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900, ek = '') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}" ${ek}>${s}</text>`;
const cip = (s, x, y, renk, yazi = '#0B1433', fs = 38) => { const w = K.yaziGen(s, fs, { mono: true, ls: 3 }) + fs * 1.7; return `<rect x="${x - w / 2}" y="${y - fs * 1.2}" width="${w}" height="${fs * 2.2}" rx="${fs * 1.1}" fill="${renk}"/><text class="mono" x="${x}" y="${y + fs * .36}" font-size="${fs}" text-anchor="middle" letter-spacing="3" style="fill:${yazi}">${s}</text>`; };
const gubi = (t, o) => M.canli('gubi', Object.assign({ t, tepkiler: TP.gubi }, o));
const gufi = (t, o) => M.canli('gufi', Object.assign({ t, tepkiler: TP.gufi }, o));

const R = PR.R, h = HK.hash, C = AU.C, G = AL.G;
const KASIF = KO.giy('gufi', [['kasket', { renk: '#C8823A', siper: '#8A5A2A' }]]);
const KERVAN = KO.giy('gufi', [['hasir', { renk: '#E8C878', bant: '#C8323C' }]]);
const BILGE = KO.giy('gubi', ['gozluk']);
const ARKEOLOG = KO.giy('gubi', [['hasir', { renk: '#E8C878', bant: '#6A4428' }], 'gozluk']);
const SIMYACI = KO.giy('gubi', [['parti', { renk: '#5A3A9C', nokta: '#FFE45C' }]]);
const TUCCAR = KO.giy('gubi', [['bere', { renk: '#7E2E3A', tuy: '#FFF3D6' }]]);
const BILIMCI = KO.giy('gubi', ['gozluk', ['papyon', { renk: '#4A8AD8' }]]);
const kam = (s, { x = 540, y = 900, k = 1, dx = 0, dy = 0 } = {}) => `<g transform="translate(${dx} ${dy}) translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;

window.renderAt = t => {
  let o = '';
  if (t < 7.6) {
    let w = AL.col(t);
    for (let i = 0; i < 5; i++) { const x = 1300 - 260 * i - 120 * t, f = i * 1.3; w += AL.deve(x, 1230 + (i % 2) * 20, .95, t, { cuval: 2, faz: f }); if (i === 1) w += gufi(t, { x: x - 10, y: 1050 + 10 * Math.abs(Math.sin(t * 6)), boy: 150, duygu: 'mutlu', ust: KERVAN, bakHedef: [900, 600] }); if (i === 0) w += AL.tac(x, 1010 + 8 * Math.sin(t * 3), 1); }
    o += w;
    const M = H.ciz({ ulkeler: H.ulke('Mali', 'Moritanya', 'Cezayir', 'Nijer', 'Libya', 'Mısır', 'Çad', 'Sudan', 'Suudi Arabistan', 'Senegal', 'Burkina Faso', 'Gine'), kutu: [90, 470, 900, 380], renk: '#F2D8A0', rim: '#FFF0C8' });
    o += AU.panel(70, 450, 940, 420, '#FFF3D6', .9) + M.svg;
    const P = [[-8.0, 12.6], [31.2, 30.0], [39.8, 21.4]].map(M.p), q = E(A(t, .4, 6.5));
    const seg = q * 2, i0 = Math.min(1, Math.floor(seg)), f = seg - i0, ux = P[i0][0] + (P[i0 + 1][0] - P[i0][0]) * f, uy = P[i0][1] + (P[i0 + 1][1] - P[i0][1]) * f;
    o += `<path d="M${P[0][0]} ${P[0][1]} L${seg > 1 ? P[1][0] : ux} ${seg > 1 ? P[1][1] : uy}${seg > 1 ? ` L${ux} ${uy}` : ''}" stroke="${C.KIR}" stroke-width="7" stroke-dasharray="16 10" fill="none"/>`;
    [['MALİ', 0], ['KAHİRE', 1], ['MEKKE', 2]].forEach(([ad, k]) => { if (q * 2 >= k - .02) o += `<circle cx="${P[k][0]}" cy="${P[k][1]}" r="11" fill="${C.LAC}"/>` + AU.Tm(ad, P[k][0], P[k][1] - 22, 26, C.LAC); });
    const c = pop(t, 3.0); if (c > 0) o += grp(AU.cip('≈18 TON ALTIN · RİVAYET', 0, 0, G.A, C.LAC, 30), 540, 960, c);
    o += AU.cip('1324 · MALİ KRALI MANSA MUSA', 540, 400, '#FFF3D6', C.LAC, 28);
    o += gubi(t, { x: 880, y: 1700 + 10 * Math.sin(t * 2), boy: 190, duygu: 'sasir', ust: BILGE, bakHedef: [500, 1100] });
  } else {
    const d = t - 7.6;
    o += AU.zemin('#E8C890', '#C8A060') + AU.R(0, 1150, 1080, 770, 0, '#B08050');
    for (let i = 0; i < 4; i++) o += `<path d="M${i * 290 - 40} 1150 V700 q140 -120 280 0 V1150Z" fill="#D8B078"/>` + AU.R(i * 290 + 40, 880, 120, 270, 60, '#6A4428', .6);
    o += AU.panel(170, 460, 740, 420, C.LAC) + AU.yaz('KAHİRE · ALTIN', 540, 540, 46, C.ALTA);
    const q = E(A(d, .2, 3.0)); let pth = ''; for (let i = 0; i <= 20; i++) { const x = 240 + i * 30, y = 620 + (i / 20 <= q ? (i / 20) * 200 + 10 * Math.sin(i) : q * 200); pth += (i ? 'L' : 'M') + x + ' ' + y; }
    o += `<path d="${pth}" stroke="${C.KIR}" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` + (q > .9 ? AU.cip('↓ YILLARCA', 760, 820, C.KIR, '#FFFFFF', 28) : '');
    for (let i = 0; i < 16; i++) { const p = ((d * .9 + h(i)) % 1); o += AL.sikke(100 + h(i + 3) * 880, 900 + p * 450, 16, { aslan: false }); }
    o += gufi(t, { x: 300, y: 1720, boy: 250, duygu: 'mutlu', ust: KERVAN, isaretHedef: [420, 1100], bakHedef: [540, 700] });
    o += gubi(t, { x: 820, y: 1660, boy: 200, duygu: 'sasir', ust: BILGE, bakHedef: [540, 700] });
  }
  $('dinamik').innerHTML = o;
};
</script>
<script src="../ortak/kanal.js"></script>
</body></html>
