<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css"></head><body style="margin:0">
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"><g id="dinamik"></g></svg>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/logo_paths.js"></script>
<script>
const h = HK.hash;
const txt = (s, x, y, size, renk, w = 900, ek = '') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}" ${ek}>${s}</text>`;
const yildiz = (x, y, r, renk, op) => `<path d="M${x} ${y - r} Q${x + r * .18} ${y - r * .18} ${x + r} ${y} Q${x + r * .18} ${y + r * .18} ${x} ${y + r} Q${x - r * .18} ${y + r * .18} ${x - r} ${y} Q${x - r * .18} ${y - r * .18} ${x} ${y - r}Z" fill="${renk}" opacity="${op}"/>`;
window.renderAt = t => {
  let o = `<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101A44"/><stop offset=".55" stop-color="#1B1640"/><stop offset="1" stop-color="#2A1838"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#FBAC39" stop-opacity=".22"/><stop offset="1" stop-color="#FBAC39" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#EE312E" stop-opacity=".2"/><stop offset="1" stop-color="#EE312E" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#7FA8FF" stop-opacity=".16"/><stop offset="1" stop-color="#7FA8FF" stop-opacity="0"/></radialGradient></defs>
    <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="540" cy="980" r="560" fill="url(#g3)"/><circle cx="300" cy="1600" r="420" fill="url(#g1)"/><circle cx="800" cy="1620" r="420" fill="url(#g2)"/>`;
  for (let i = 0; i < 90; i++) { const x = h(i) * 1080, y = h(i + 7) * 1920;  // sade yuvarlak noktalar (logodaki pırıltıyla karışmasın)
    if (y > 100 && y < 760 && x > 120 && x < 960) continue;  // logo + başlık alanı temiz
    if (y > 780 && y < 1390 && x > 90 && x < 990) continue;  // soru alanı temiz
    o += `<circle cx="${x}" cy="${y}" r="${1.5 + 3 * h(i + 3)}" fill="#FFF3D6" opacity="${.15 + .35 * h(i + 5)}"/>`; }
  // LOGO (üst)
  const S = 700 / 233; let l = `<g transform="translate(540 330) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#FFF3E0' : p.fill}"/>`;
  o += l + '</g>';
  // başlık
  o += txt("MERAK ETTİĞİNİ SOR", 540, 640, 62, '#FFF3E0') + txt("BİZ ANLATALIM!", 540, 715, 62, '#FBAC39');
  // ORTA: boş — Instagram soru çıkartması buraya
  // alt: Gubi + Gufi büyük, yukarıya (soru alanına) bakıyor
  o += `<ellipse cx="540" cy="1712" rx="400" ry="24" fill="#000" opacity=".25"/>`;
  o += M.canli('gufi', { t: .3, x: 705, y: 1700, boy: 320, duygu: 'merak', bakHedef: [540, 1120], canlilik: false });
  o += M.canli('gubi', { t: .3, x: 350, y: 1510, boy: 300, duygu: 'merak', bakHedef: [540, 1120], canlilik: false, parla: .5 });

  document.getElementById('dinamik').innerHTML = o;
};
</script></body></html>
