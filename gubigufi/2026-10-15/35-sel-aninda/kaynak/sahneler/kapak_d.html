<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css"></head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"><g id="dinamik"></g></svg>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/au.js"></script><script src="../ortak/kp.js"></script><script src="../ortak/sl.js"></script><script src="../ortak/se.js"></script><script src="../ortak/logo_paths.js"></script>
<script>
const R = PR.R, h = HK.hash;
const txt = (s, x, y, size, renk = '#FFF3E0', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
window.renderAt = t => {
  let o = R(0, 0, 540, 1150, 0, '#C8283A') + R(540, 0, 540, 1150, 0, '#1E9A5A') + `<path d="M540 0 V1150" stroke="#FFFFFF" stroke-width="10"/>`;
  o += txt('YANLIŞ', 270, 260, 90, '#FFFFFF') + txt('DOĞRU', 810, 260, 90, '#FFFFFF');
  o += `<g transform="translate(270 620)">` + R(-170, -170, 340, 340, 30, '#FFF8EE') + R(-60, -140, 120, 260, 10, '#8A6A4A') + `<circle cx="40" cy="0" r="12" fill="#3A2A1A"/>` + R(-170, 60, 340, 110, 0, '#3E8EDE', .8) + `<path d="M-130 -130 L130 130 M130 -130 L-130 130" stroke="#C8283A" stroke-width="22" stroke-linecap="round"/></g>` + txt('KAPIYI AÇMAK', 270, 880, 50, '#FFFFFF');
  o += `<g transform="translate(810 620)">` + R(-170, -170, 340, 340, 30, '#FFF8EE') + R(-130, -120, 260, 150, 12, '#BFE0FF') + `<path d="M0 -80 v110 m-30 -30 l30 30 l30 -30" stroke="#1B2440" stroke-width="14" fill="none"/>` + R(-170, 60, 340, 110, 0, '#3E8EDE', .8) + `<circle cx="120" cy="-120" r="44" fill="#1E9A5A"/><path d="M98 -120 l16 16 l28 -32" stroke="#FFFFFF" stroke-width="12" fill="none"/></g>` + txt('CAMI AÇMAK', 810, 880, 50, '#FFFFFF');
  o += M.canli('gufi', { t: 1, x: 140, y: 1130, boy: 150, duygu: 'saskin', bakHedef: [270, 620] }) + M.canli('gubi', { t: 1, x: 950, y: 1050, boy: 110, duygu: 'kararli', bakHedef: [810, 620] });
  o += `<rect x="0" y="1150" width="1080" height="770" fill="#1B2440"/><rect x="0" y="1150" width="1080" height="18" fill="#FFD23F"/>`;
  o += `<text class="mono" x="540" y="1250" font-size="38" text-anchor="middle" letter-spacing="6" style="fill:#FFD23F">ARABAN SUDA KALIRSA</text>`;
  o += txt('İLK HAREKETİN', 540, 1362, 96) + txt('NE OLMALI?', 540, 1470, 96, '#FFD23F');
  const S = 150 / 233; let l = `<g transform="translate(540 1600) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#FFF3E0' : p.fill}"/>`;
  document.getElementById('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
