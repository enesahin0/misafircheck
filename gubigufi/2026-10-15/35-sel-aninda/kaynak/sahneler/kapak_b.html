<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css"></head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"><g id="dinamik"></g></svg>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/au.js"></script><script src="../ortak/kp.js"></script><script src="../ortak/sl.js"></script><script src="../ortak/se.js"></script><script src="../ortak/logo_paths.js"></script>
<script>
const R = PR.R, h = HK.hash;
const txt = (s, x, y, size, renk = '#FFF3E0', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
window.renderAt = t => {
  let o = AU.zemin('#0E7C86', '#064A52');
  o += R(0, 820, 1080, 330, 0, '#3E8EDE', .9) + SE.dalga(820, 0, '#8CC8F4', 10, 18);
  for (let i = 0; i < 7; i++) o += `<path d="M${80 + i * 150} ${900 + (i % 2) * 70} l90 0 m-22 -16 l22 16 l-22 16" stroke="#FFFFFF" stroke-width="8" fill="none" opacity=".7"/>`;
  o += `<g transform="rotate(24 520 900)">` + KP.yetiskin(520, 900, 1.1, { renk: '#FFF3E0' }) + '</g>';
  o += `<path d="M180 820 V760 M150 820 H210 M150 760 H210" stroke="#FFD23F" stroke-width="8"/>`;
  o += `<g transform="rotate(-6 540 300)"><rect x="200" y="210" width="680" height="190" rx="34" fill="#FFD23F"/>` + txt('15 cm', 540, 345, 140, '#1B2440') + `</g>` + `<text class="mono" x="540" y="460" font-size="32" text-anchor="middle" letter-spacing="4" style="fill:#FFFFFF">AKAN SU SENİ DEVİREBİLİR</text>`;
  o += M.canli('gufi', { t: 1, x: 900, y: 1100, boy: 160, duygu: 'saskin', bakHedef: [520, 700] }) + M.canli('gubi', { t: 1, x: 150, y: 640, boy: 100, duygu: 'saskin', bakHedef: [520, 700] });
  o += `<rect x="0" y="1150" width="1080" height="770" fill="#0A2A30"/><rect x="0" y="1150" width="1080" height="18" fill="#7CE0E8"/>`;
  o += `<text class="mono" x="540" y="1250" font-size="38" text-anchor="middle" letter-spacing="6" style="fill:#7CE0E8">SOKAK · BODRUM · ARABA</text>`;
  o += txt('SEL ANINDA', 540, 1362, 96) + txt('NE YAPMALISIN?', 540, 1470, 96, '#7CE0E8');
  const S = 150 / 233; let l = `<g transform="translate(540 1600) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#FFF3E0' : p.fill}"/>`;
  document.getElementById('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
