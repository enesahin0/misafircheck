<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css"></head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"><g id="zemin"></g><g class="kamera"><g id="dinamik"></g></g></svg>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/capa.js"></script><script src="../ortak/logo_paths.js"></script>
<script>
const $ = i => document.getElementById(i);
const txt = (s, x, y, size, renk = '#1B1640', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
window.renderAt = t => {
  let o = C.studyo(1.3);
  o += C.cark(540, 640, 330, C.hedefAci(65) - 8, 65);
  o += C.cipa(860, 1000, .7, -12, '#6B3A5B');
  o += M.canli('gufi', { t: .5, x: 250, y: 1120, boy: 170, duygu: 'saskin', bakHedef: [540, 330] });
  o += M.canli('gubi', { t: 1.2, x: 900, y: 360, boy: 120, duygu: 'merak', bakHedef: [540, 640] });
  o += `<rect x="0" y="1150" width="1080" height="770" fill="#FFFFFF"/><rect x="0" y="1150" width="1080" height="18" fill="#E056C1"/>`;
  o += `<text class="mono" x="540" y="1250" font-size="38" text-anchor="middle" letter-spacing="6" style="fill:#E056C1">BEYİN TUZAKLARI · ÇAPA ETKİSİ</text>`;
  o += txt('BİR ÇARK', 540, 1370, 100) + txt('CEVABINI DEĞİŞTİRDİ', 540, 1470, 76, '#E056C1');
  const S = 150 / 233; let l = `<g transform="translate(540 1650) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill}"/>`;
  $('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
