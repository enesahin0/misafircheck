<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="zemin"></g><g class="kamera"><g id="sabit"></g><g id="dinamik"></g></g>
</svg>
<script>window.SB = 0;</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/bug.js"></script>
<script src="../ortak/logo_paths.js"></script>
<script>
const $ = i => document.getElementById(i);
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
$('zemin').innerHTML = B.bg({ nx: 540, ny: 700, neb: B.P.amber, no: .2 }) + B.parca(3, 60);
window.renderAt = t => {
  let o = K.glow({ x: 540, y: 700, r: 520, renk: B.P.amber, guc: .3 });
  o += `<g transform="translate(540 700) scale(1.05) rotate(-4)">` + B.defter(B.elYazi('9/9', -200, -220, 1, 40) + B.guve(-60, -60, 1.25, 0, -12) + B.bant(-60, -80, 420, -10) + B.elYazi('First actual case of bug', -200, 150, 1, 44) + B.elYazi('being found.', -200, 206, 1, 44)) + `</g>`;
  o += `<g transform="translate(830 430) rotate(12)"><rect x="-90" y="-44" width="180" height="88" rx="44" fill="${B.P.kirmizi}"/><text class="mono" x="0" y="13" font-size="34" text-anchor="middle" style="fill:#FFF3D6">1947</text></g>`;
  o += M.canli('gubi', { t: 1.2, x: 180, y: 1010, boy: 140, duygu: 'saskin', bakHedef: [480, 640] });
  o += M.canli('gufi', { t: .5, x: 910, y: 1110, boy: 150, duygu: 'saskin', bakHedef: [480, 640] });
  o += `<rect x="0" y="1160" width="1080" height="760" fill="#1E1B4B"/><rect x="0" y="1110" width="1080" height="60" fill="#1E1B4B" opacity=".6"/>`;
  o += `<text class="mono" x="540" y="1235" font-size="40" text-anchor="middle" letter-spacing="7" style="fill:#00C2E0">HARVARD · MARK II</text>`;
  o += txt('İLK BİLGİSAYAR HATASI', 540, 1345, 76) + txt('GERÇEK BİR BÖCEKTİ', 540, 1440, 84, B.P.amber);
  const S = 150 / 233; let l = `<g transform="translate(540 1600) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#F6F1E7' : p.fill}"/>`;
  $('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
