<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css"></head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"><g id="dinamik"></g></svg>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/para.js"></script><script src="../ortak/logo_paths.js"></script>
<script>
const txt = (s, x, y, size, renk = '#FFF3E0', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
window.renderAt = t => {
  const T = CV.ton('adacayi');
  let o = CV.oda(T, { zeminY: 980, dolap: false, pencere: [760, 150, 220, 260] }) + CV.raf(50, 170, 380, T, 7) + CV.saat(560, 170, 50, T, 2) + CV.bitki(990, 980, .9, T);
  o += PR.banknot(540, 560, 860, { deger: '', birim: 'LİRA' });
  o += `<text x="470" y="600" font-size="130" font-weight="900" text-anchor="middle" style="fill:#7B4E96">20</text>`;
  [[610, 440, -15], [700, 380, 12], [760, 470, 22], [640, 850, -20], [780, 800, 10], [880, 880, 25]].forEach(([x, y, r]) => o += PR.sifir(x, y, 110, '#7B4E96', r));
  o += PR.makas(940, 600, .85, .8, 180);
  o += M.canli('gufi', { t: .5, x: 300, y: 1140, boy: 300, duygu: 'saskin', bakHedef: [800, 450], ust: KO.giy('gufi', [['silindir', { renk: '#2A2440', bant: '#D8A032' }], 'monokl', ['papyon', { renk: '#D8A032' }]]) });
  o += M.canli('gubi', { t: 1.2, x: 880, y: 1010, boy: 190, duygu: 'mutlu', bakHedef: [540, 560], ust: KO.giy('gubi', [['kravat', { renk: '#1B3A6A' }], 'gozluk']) });
  o += `<rect x="0" y="1150" width="1080" height="770" fill="#1E4640"/><rect x="0" y="1150" width="1080" height="18" fill="#D8A032"/>`;
  o += `<text class="mono" x="540" y="1250" font-size="38" text-anchor="middle" letter-spacing="6" style="fill:#F2CE7A">PARANIN DİLİ · 2005</text>`;
  o += txt('ALTI SIFIR', 540, 1370, 116) + txt('SİLİNİNCE NE OLUR?', 540, 1460, 64, '#F2CE7A');
  const S = 150 / 233; let l = `<g transform="translate(540 1600) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#FFF3E0' : p.fill}"/>`;
  document.getElementById('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
