<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="zemin"></g><g class="kamera"><g id="sabit"></g><g id="dinamik"></g></g>
</svg>
<script>window.SB = 0;</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/limon.js"></script>
<script src="../ortak/logo_paths.js"></script>
<script>
const $ = i => document.getElementById(i);
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
$('zemin').innerHTML = L.bg({ nx: 540, ny: 760, neb: L.P.limon, no: .22 }) + L.parca(3, 70);
window.renderAt = t => {
  let o = K.glow({ x: 540, y: 820, r: 520, renk: L.P.limon, guc: .35 });
  o += L.dilim(270, 560, 150, -15) + L.limon(830, 520, 110);
  for (let i = 0; i < 4; i++) o += L.damla(250 + i * 45, 760 + i * 40, 1, L.P.limon, .9 - i * .15);
  o += M.canli('gufi', { t: .5, x: 560, y: 1050, boy: 330, duygu: 'kararli', bak: [.2, .1], ust: L.cila(560, 1050, 330, 1, .3) });
  o += `<g transform="translate(560 660) rotate(-8)"><rect x="-80" y="-30" width="160" height="60" rx="30" fill="${L.P.kirmizi}"/><text class="mono" x="0" y="11" font-size="30" text-anchor="middle" style="fill:#FFF3D6">● REC</text></g>`;
  o += M.canli('gubi', { t: 1.2, x: 870, y: 930, boy: 130, duygu: 'saskin', bakHedef: [560, 900] });
  o += `<rect x="0" y="1160" width="1080" height="760" fill="#1E1B4B"/><rect x="0" y="1110" width="1080" height="60" fill="#1E1B4B" opacity=".6"/>`;
  o += `<text class="mono" x="540" y="1235" font-size="40" text-anchor="middle" letter-spacing="7" style="fill:#E056C1">1995 · GERÇEK HİKÂYE</text>`;
  o += txt('LİMON SUYUYLA', 540, 1345, 88) + txt('GÖRÜNMEZ OLDU(!?)', 540, 1440, 88, L.P.limon);
  const S = 150 / 233; let l = `<g transform="translate(540 1630) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#F6F1E7' : p.fill}"/>`;
  $('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
