<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="kamYak"><g id="zemin"></g><g class="kamera"><g id="sabit"></g><g id="dinamik"></g></g></g>
</svg>
<script>window.SB = 0; const TP = {"gubi": [], "gufi": []};</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/zemin.js"></script><script src="../ortak/hareket.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/detay.js"></script><script src="../ortak/au.js"></script><script src="../ortak/kp.js"></script>
<script src="../ortak/harita/d3-array.min.js"></script><script src="../ortak/harita/d3-geo.min.js"></script><script src="../ortak/harita/topojson-client.min.js"></script><script src="../ortak/harita/dunya50.js"></script><script src="../ortak/harita/ulke_tablo.js"></script><script src="../ortak/harita/turkiye10.js"></script><script src="../ortak/harita/harita.js"></script>
<script src="../ortak/logo_paths.js"></script><script src="../ortak/altyazi.js"></script>
<script>
const $ = i => document.getElementById(i), A = K.aralik, E = q => q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => back(A(t, a, a + d));
const grp = (s, x, y, k = 1, r = 0, op = 1) => `<g transform="translate(${x} ${y}) scale(${k}) rotate(${r})" opacity="${op}">${s}</g>`;
const olc = (s, x, y, k) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900, ek = '') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}" ${ek}>${s}</text>`;
const cip = (s, x, y, renk, yazi = '#0B1433', fs = 38) => { const w = K.yaziGen(s, fs, { mono: true, ls: 3 }) + fs * 1.7; return `<rect x="${x - w / 2}" y="${y - fs * 1.2}" width="${w}" height="${fs * 2.2}" rx="${fs * 1.1}" fill="${renk}"/><text class="mono" x="${x}" y="${y + fs * .36}" font-size="${fs}" text-anchor="middle" letter-spacing="3" style="fill:${yazi}">${s}</text>`; };
const gubi = (t, o) => M.canli('gubi', Object.assign({ t, tepkiler: TP.gubi }, o));
const gufi = (t, o) => M.canli('gufi', Object.assign({ t, tepkiler: TP.gufi }, o));

const R = PR.R, h = HK.hash, C = AU.C, KC = KP.C;
const VELI = KO.giy('gufi', [['kasket', { renk: '#2A3A6A', siper: '#1B2440' }]]);
const GONULLU = KO.giy('gubi', [['bere', { renk: '#C2551E', tuy: '#FFE6B8' }]]);
const kam = (s, { x = 540, y = 900, k = 1, dx = 0, dy = 0 } = {}) => `<g transform="translate(${dx} ${dy}) translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const klip = (s, x, y, w, hh) => { const i = 'kl' + Math.round(x) + '_' + Math.round(y) + '_' + Math.round(w); return `<defs><clipPath id="${i}"><rect x="${x}" y="${y}" width="${w}" height="${hh}"/></clipPath></defs><g clip-path="url(#${i})">${s}</g>`; };
const bam = (t, a, d = .35) => { const q = A(t, a, a + d); return q > 0 && q < 1 ? `<rect width="1080" height="1920" fill="#FFFFFF" opacity="${.55 * (1 - q)}"/>` : ''; };

window.renderAt = t => {
  let o = '';
  if (t < 1.3) {
    o += `<rect width="1080" height="1920" fill="#0A0E1C"/><ellipse cx="540" cy="1150" rx="380" ry="60" fill="#FFFFFF" opacity=".08"/>` + K.glow({ x: 540, y: 900, r: 520, renk: '#8AA0D8', guc: .25 });
    o += KP.kopek(470, 1150, 1.5, { t, karanlik: .55 });
    o = kam(o, { y: 1000, k: 1 + .06 * t });
  } else {
    const sag = t > 3.2, q = E(A(t, 1.3, 1.6));
    let L = AU.zemin('#22345E', '#0E1830') + K.glow({ x: 300, y: 1000, r: 420, renk: '#3E6FD8', guc: .25 });
    L += KP.kopek(360 - 20 * q, 1170, 1.15, { yon: -1, mod: 'tehdit', t, karanlik: .6 });
    L += KP.cocuk(105 - 30 * E(A(t, 1.5, 2.6)), 1170, 1.15, { renk: '#C8D8EE', canta: '#5A6A9A', adim: t < 2.6 ? t * 1.5 : null, yon: 1 });
    L += grp(AU.cip('KÂBUS', 0, 0, KC.MAVI, '#FFFFFF', 44), 270, 520, pop(t, 1.5));
    let Rr = sag ? AU.zemin('#FFB25E', '#E0702E') + K.glow({ x: 780, y: 1000, r: 420, renk: '#FFE08A', guc: .35 }) : `<rect width="1080" height="1920" fill="#06080F"/>`;
    Rr += KP.kopek(720 + 20 * q, 1170, 1.15, { yon: 1, mod: sag ? 'dost' : 'notr', t, karanlik: sag ? 0 : .95 });
    if (sag) { Rr += KP.yetiskin(1000, 1160, .62, { renk: '#5A2A1E', poz: 'diz', yon: -1 }); Rr += grp(AU.cip('AİLE', 0, 0, KC.TURU, '#FFFFFF', 44), 810, 520, pop(t, 3.3));
      for (let i = 0; i < 3; i++) { const a = A(t, 3.6 + i * .3, 4.8 + i * .3); if (a > 0 && a < 1) Rr += KP.kalp(860 + i * 30, 980 - a * 200, .22, '#E8505B').replace('<g ', `<g opacity="${1 - a}" `); } }
    o += klip(L, 0, 0, 540, 1920) + klip(Rr, 540, 0, 540, 1920);
    o += `<path d="M540 0 V1920" stroke="#FFFFFF" stroke-width="8"/>`;
    o = kam(o, { y: 1000, k: 1 + .22 * (1 - back(A(t, 1.3, 1.75))) });
    o += bam(t, 1.3) + (sag ? bam(t, 3.2) : '');
  }
  $('dinamik').innerHTML = o;
};
</script>
<script src="../ortak/kanal.js"></script>
</body></html>
