<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="kamYak"><g id="zemin"></g><g class="kamera"><g id="sabit"></g><g id="dinamik"></g></g></g>
</svg>
<script>window.SB = 21.58; const TP = {"gubi": [[2.3, "isaret"], [6.0, "dusun"]], "gufi": [[2.5, "sasir"]]};</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/zemin.js"></script><script src="../ortak/hareket.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/detay.js"></script><script src="../ortak/au.js"></script>
<script src="../ortak/harita/d3-array.min.js"></script><script src="../ortak/harita/d3-geo.min.js"></script><script src="../ortak/harita/topojson-client.min.js"></script><script src="../ortak/harita/dunya50.js"></script><script src="../ortak/harita/ulke_tablo.js"></script><script src="../ortak/harita/turkiye10.js"></script><script src="../ortak/harita/harita.js"></script>
<script src="../ortak/logo_paths.js"></script><script src="../ortak/altyazi.js"></script>
<script>
const $ = i => document.getElementById(i), A = K.aralik, E = q => q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => back(A(t, a, a + d));
const grp = (s, x, y, k = 1, r = 0, op = 1) => `<g transform="translate(${x} ${y}) scale(${k}) rotate(${r})" opacity="${op}">${s}</g>`;
const olc = (s, x, y, k) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900, ek = '') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}" ${ek}>${s}</text>`;
const cip = (s, x, y, renk, yazi = '#0B1433', fs = 38) => { const w = K.yaziGen(s, fs, { mono: true, ls: 3 }) + fs * 1.7; return `<rect x="${x - w / 2}" y="${y - fs * 1.2}" width="${w}" height="${fs * 2.2}" rx="${fs * 1.1}" fill="${renk}"/><text class="mono" x="${x}" y="${y + fs * .36}" font-size="${fs}" text-anchor="middle" letter-spacing="3" style="fill:${yazi}">${s}</text>`; };
const gubi = (t, o) => M.canli('gubi', Object.assign({ t, tepkiler: TP.gubi }, o));
const gufi = (t, o) => M.canli('gufi', Object.assign({ t, tepkiler: TP.gufi }, o));

const R = PR.R, h = HK.hash, C = AU.C;
const VEZNEDAR = KO.giy('gubi', [['papyon', { renk: '#E8505B' }], 'gozluk']);
const VATANDAS = KO.giy('gufi', [['kasket', { renk: '#2A2E40', siper: '#1B1F2A' }]]);
const kam = (s, { x = 540, y = 900, k = 1, dx = 0, dy = 0 } = {}) => `<g transform="translate(${dx} ${dy}) translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;

window.renderAt = t => {
  let o = AU.zemin('#0E2040', '#071026');
  for (let i = 0; i < 40; i++) o += `<circle cx="${h(i) * 1080}" cy="${h(i + 50) * 1200 + 200}" r="${1.5 + h(i + 9) * 2}" fill="#FFFFFF" opacity="${.2 + .2 * h(i + 3)}"/>`;
  if (t < 4.6) {
    const q = E(A(t, .1, 2.2)), dn = [-35 + (-174 + 35) * q, -39 + (41 + 39) * q];
    const K1 = H.kure({ x: 540, y: 780, r: 340, donus: dn });
    o += K1.svg; const p = K1.p([174.8, -41.3]);
    const a = pop(t, 2.2); if (p && a > 0) o += grp(H.igne(0, 0, '#EE312E', 1.4, ''), p[0], p[1], a);
    if (a > 0) o += grp(AU.cip('1894 · YENİ ZELANDA', 0, 0, C.KREM, C.LAC, 34), 540, 1180, a);
    o += AU.cip('DÜNYADA İLK ASGARİ ÜCRET', 540, 390, C.ALT, C.LAC, 32);
    o += gubi(t, { x: 870, y: 1700, boy: 210, ust: VEZNEDAR, isaretHedef: p || [540, 780], bakHedef: p || [540, 780] });
    o += gufi(t, { x: 220, y: 1770, boy: 250, ust: VATANDAS, duygu: t > 2.4 ? 'sasir' : 'merak', bakHedef: [540, 780] });
    o = kam(o, { y: 780, k: .95 + .1 * E(A(t, 0, 4.6)) });
  } else {
    const d = t - 4.6;
    const M = H.ciz({ ulkeler: H.ulke('Türkiye'), kutu: [50, 470, 980, 520], renk: '#E9DDC2' });
    o += M.svg;
    const IL = [[28.97, 41.01], [32.85, 39.93], [27.14, 38.42], [35.32, 37.0], [29.06, 40.18], [31.79, 41.45], [39.72, 41.0], [40.2, 37.9], [41.27, 39.9], [30.7, 36.9], [37.0, 39.75]];
    IL.forEach((ll, i) => { const [x, y] = M.p(ll), g = pop(d, .3 + i * .18); if (g <= 0) return; const hh = (40 + h(i * 3) * 110) * g; o += AU.R(x - 14, y - hh, 28, hh, 6, i % 3 ? C.YES : C.ALT) + `<circle cx="${x}" cy="${y}" r="9" fill="${C.LAC}"/>`; });
    o += AU.cip('HER İLİN RAKAMI AYRI', 540, 390, C.YES, '#FFFFFF', 34);
    const s = pop(d, .2, .5); if (s > 0) o += grp(AU.R(-230, -60, 460, 120, 18, 'none') + `<rect x="-230" y="-60" width="460" height="120" rx="18" fill="none" stroke="${C.KIR}" stroke-width="10"/>` + AU.yaz('1951 · İLK YÖNETMELİK', 0, 16, 40, C.KIR), 700, 1130, 1.6 - .6 * s, -8, s);
    o += AU.Tm('temsili', 960, 1060, 22, '#8A90A8');
    o += gufi(t, { yol: [[4.6, 180, 1770, 250], [9.9, 520, 1770, 250]], x: 180, y: 1770, boy: 250, ust: VATANDAS, bakHedef: [540, 700] });
    o += gubi(t, { x: 860, y: 1700, boy: 210, ust: VEZNEDAR, duygu: 'merak', bakHedef: [540, 700] });
    o = kam(o, { dx: 20 - 40 * E(A(d, 0, 5.3)) });
  }
  $('dinamik').innerHTML = o;
};
</script>
<script src="../ortak/kanal.js"></script>
</body></html>
