<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css"></head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"><g id="dinamik"></g></svg>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/detay.js"></script><script src="../ortak/nb.js"></script><script src="../ortak/logo_paths.js"></script>
<script>
const R = PR.R, h = HK.hash;
const txt = (s, x, y, size, renk = '#FFF3E0', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
window.renderAt = t => {
  const T = 1.2;
  let o = NB.salon(T, '');
  o += NB.alinti(["CANNES'IN", "MUHTARI MISIN,", "NESİN SEN?"], 'Z. DEMİRKUBUZ', { x: 540, y: 430, w: 880, fs: 92, p: 1, rot: -2 });
  o += NB.koltuk(190, 1100, .75, 'Z.D.', { vurgu: 1 }) + NB.koltuk(890, 1100, .75, 'N.B.C.', { vurgu: 0 });
  o += M.canli('gubi', { t: T, x: 390, y: 1100, boy: 230, duygu: 'sasir', parla: .3, bakHedef: [540, 600], ust: KO.giy('gubi', [['papyon', { renk: '#C8232F' }], 'gozluk']) });
  o += M.canli('gufi', { t: T, x: 700, y: 1135, boy: 230, duygu: 'merak', bakHedef: [540, 600], ust: KO.giy('gufi', [['melon', {}], 'monokl']) });
  o += `<rect x="0" y="1150" width="1080" height="770" fill="#14102E"/><rect x="0" y="1150" width="1080" height="18" fill="#E8505B"/>`;
  o += `<text class="mono" x="540" y="1250" font-size="38" text-anchor="middle" letter-spacing="6" style="fill:#F4A0A8">İKİ YÖNETMEN · BİR KAVGA</text>`;
  o += txt('SİNEMANIN EN', 540, 1362, 90) + txt('BÜYÜK KÜSLÜĞÜ', 540, 1458, 82, '#F4A0A8');
  const S = 150 / 233; let l = `<g transform="translate(540 1600) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#FFF3E0' : p.fill}"/>`;
  document.getElementById('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
