<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css"></head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg"><g id="dinamik"></g></svg>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/au.js"></script><script src="../ortak/sl.js"></script><script src="../ortak/logo_paths.js"></script>
<script>
const R = PR.R, h = HK.hash;
const txt = (s, x, y, size, renk = '#FFF3E0', w = 900) => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}">${s}</text>`;
window.renderAt = t => {
  let o = AU.zemin('#2A3656', '#121A30');
  o += SL.bulut(260, 250, 1.4, '#3A4664') + SL.bulut(800, 210, 1.6, '#323E5A');
  // İstanbul silueti: kule + kubbe + minareler + binalar
  let s = '';
  for (let i = 0; i < 14; i++) { const x = i * 80 - 20, hh = 160 + h(i) * 220; s += R(x, 1000 - hh, 74, hh, 4, '#1A2440'); }
  s += `<path d="M380 1000 L380 760 Q470 640 560 760 L560 1000Z" fill="#141C34"/><circle cx="470" cy="700" r="70" fill="#141C34"/>` + R(330, 600, 18, 400, 6, '#141C34') + R(592, 600, 18, 400, 6, '#141C34') + `<path d="M330 600 L339 560 L348 600Z M592 600 L601 560 L610 600Z" fill="#141C34"/>`;
  s += R(820, 640, 70, 360, 6, '#141C34') + `<path d="M810 640 L855 560 L900 640Z" fill="#141C34"/>`;
  o += s + SL.yagmur(0, { n: 140, op: .55 });
  // su seviyesi + yüzen nesneler
  o += M.canli('gufi', { t: 1, x: 760, y: 975, boy: 170, duygu: 'saskin', bakHedef: [540, 700] });
  o += R(0, 900, 1080, 250, 0, SL.SU, .85) + `<path d="M0 900 Q90 880 180 900 T360 900 T540 900 T720 900 T900 900 T1080 900" stroke="${SL.SUA}" stroke-width="8" fill="none"/>`;
  o += R(120, 860, 150, 60, 14, '#E8323C') + R(150, 830, 90, 40, 12, '#E8323C') + `<circle cx="150" cy="925" r="20" fill="#222"/>`;
  o += M.canli('gubi', { t: 1, x: 940, y: 760, boy: 120, duygu: 'saskin', bakHedef: [540, 700] });
  o += `<g transform="translate(940 650) scale(.8)"><path d="M-110 0 Q-110 -110 0 -110 Q110 -110 110 0 Q82 -22 55 0 Q27 -22 0 0 Q-27 -22 -55 0 Q-82 -22 -110 0Z" fill="#3E8EDE"/><path d="M0 0 V110" stroke="#2A2E40" stroke-width="7"/></g>`;
  o += `<g transform="rotate(-6 540 500)"><rect x="300" y="400" width="480" height="170" rx="30" fill="#FFE45C"/>` + txt('193 L', 540, 515, 120, '#1B2440') + `</g>` + `<text class="mono" x="540" y="620" font-size="30" text-anchor="middle" letter-spacing="4" style="fill:#FFFFFF">METREKAREYE · TEK GÜNDE</text>`;
  o += `<rect x="0" y="1150" width="1080" height="770" fill="#121A30"/><rect x="0" y="1150" width="1080" height="18" fill="#3E8EDE"/>`;
  o += `<text class="mono" x="540" y="1250" font-size="38" text-anchor="middle" letter-spacing="6" style="fill:#8CC8F4">14 EKİM 2026</text>`;
  o += txt('İSTANBUL’DA YAĞMUR', 540, 1362, 86) + txt('NASIL SELE DÖNÜŞTÜ?', 540, 1466, 86, '#FFE45C');
  const S = 150 / 233; let l = `<g transform="translate(540 1600) scale(${S}) translate(-141.5 -141.5)">`;
  for (const p of window.LOGO_PATHS) l += `<path transform="${p.t}" d="${p.d}" fill="${p.fill === '#231f20' ? '#FFF3E0' : p.fill}"/>`;
  document.getElementById('dinamik').innerHTML = o + l + '</g>';
};
</script></body></html>
