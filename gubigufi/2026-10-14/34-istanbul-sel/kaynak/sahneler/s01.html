<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ortak/stil.css"><link rel="stylesheet" href="../ortak/kanal.css">
</head><body>
<svg viewBox="0 0 1080 1920" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <g id="kamYak"><g id="zemin"></g><g class="kamera"><g id="sabit"></g><g id="dinamik"></g></g></g>
</svg>
<script>window.SB = 0; const TP = {"gubi": [[5.0, "say"]], "gufi": []};</script>
<script src="../ortak/kit.js"></script><script src="../ortak/maskot.js"></script><script src="../ortak/kisi.js"></script><script src="../ortak/zemin.js"></script><script src="../ortak/hareket.js"></script><script src="../ortak/cevre.js"></script><script src="../ortak/kostum.js"></script><script src="../ortak/para.js"></script><script src="../ortak/hk.js"></script><script src="../ortak/detay.js"></script><script src="../ortak/au.js"></script><script src="../ortak/kp.js"></script><script src="../ortak/al.js"></script><script src="../ortak/sl.js"></script>
<script src="../ortak/harita/d3-array.min.js"></script><script src="../ortak/harita/d3-geo.min.js"></script><script src="../ortak/harita/topojson-client.min.js"></script><script src="../ortak/harita/dunya50.js"></script><script src="../ortak/harita/ulke_tablo.js"></script><script src="../ortak/harita/turkiye10.js"></script><script src="../ortak/harita/harita.js"></script>
<script src="../ortak/logo_paths.js"></script><script src="../ortak/altyazi.js"></script>
<script>
const $ = i => document.getElementById(i), A = K.aralik, E = q => q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, a, d = .45) => back(A(t, a, a + d));
const grp = (s, x, y, k = 1, r = 0, op = 1) => `<g transform="translate(${x} ${y}) scale(${k}) rotate(${r})" opacity="${op}">${s}</g>`;
const olc = (s, x, y, k) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const txt = (s, x, y, size, renk = '#FFF3D6', w = 900, ek = '') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="middle" style="fill:${renk}" ${ek}>${s}</text>`;
const cip = (s, x, y, renk, yazi = '#0B1433', fs = 38) => { const w = K.yaziGen(s, fs, { mono: true, ls: 3 }) + fs * 1.7; return `<rect x="${x - w / 2}" y="${y - fs * 1.2}" width="${w}" height="${fs * 2.2}" rx="${fs * 1.1}" fill="${renk}"/><text class="mono" x="${x}" y="${y + fs * .36}" font-size="${fs}" text-anchor="middle" letter-spacing="3" style="fill:${yazi}">${s}</text>`; };
const gubi = (t, o) => M.canli('gubi', Object.assign({ t, tepkiler: TP.gubi }, o));
const gufi = (t, o) => M.canli('gufi', Object.assign({ t, tepkiler: TP.gufi }, o));

const R = PR.R, h = HK.hash, C = AU.C;
const kam = (s, { x = 540, y = 900, k = 1, dx = 0, dy = 0 } = {}) => `<g transform="translate(${dx} ${dy}) translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${s}</g>`;
const bam = (t, a, d = .35) => { const q = A(t, a, a + d); return q > 0 && q < 1 ? `<rect width="1080" height="1920" fill="#FFFFFF" opacity="${.35 * (1 - q)}"/>` : ''; };
const semsiye = (x, y, s = 1, renk = '#3E8EDE') => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-110 0 Q-110 -110 0 -110 Q110 -110 110 0 Q82 -22 55 0 Q27 -22 0 0 Q-27 -22 -55 0 Q-82 -22 -110 0Z" fill="${renk}"/><path d="M0 -110 Q-30 -60 -55 0 M0 -110 Q30 -60 55 0" stroke="#000" stroke-width="3" opacity=".15" fill="none"/><path d="M0 0 V110 Q0 130 -18 128" stroke="#2A2E40" stroke-width="7" fill="none"/></g>`;
const zeminK = () => AU.zemin('#1E2A44', '#0E1426');

window.renderAt = t => {
  let o = zeminK() + SL.bulut(300, 300, 1.2, '#3A4664') + SL.bulut(780, 260, 1.4, '#323E5A');
  o += SL.yagmur(t, { n: 120, op: .5 });
  // 1 m² zemin (eğik ızgara)
  const P = (u, v) => [540 + (u - v) * 230, 680 + (u + v) * 100];
  const k = [P(0, 0), P(1, 0), P(1, 1), P(0, 1)];
  o += `<path d="M${k.map(p => p.join(' ')).join(' L')}Z" fill="#2A3A5A" stroke="#BFE0FF" stroke-width="4"/>`;
  for (let i = 1; i < 4; i++) { const a = P(i / 4, 0), b = P(i / 4, 1), c = P(0, i / 4), d = P(1, i / 4); o += `<path d="M${a.join(' ')} L${b.join(' ')} M${c.join(' ')} L${d.join(' ')}" stroke="#BFE0FF" stroke-width="2" opacity=".4"/>`; }
  const su = A(t, .4, 4.2); o += `<path d="M${k.map(p => [p[0], p[1] - 70 * su].join(' ')).join(' L')}Z" fill="${SL.SU}" opacity="${.55 * su}"/>`;
  o += AU.Tm('1 m²', 860, 790, 30, '#BFE0FF');
  o += grp(AU.yaz('193 L', 0, 0, 150, '#FFFFFF') + AU.Tm('METREKAREYE', 0, 60, 30, '#BFE0FF'), 540, 530, pop(t, 1.6));
  // 19 kova
  for (let i = 0; i < 19; i++) { const r = Math.floor(i / 7), c = i % 7, x = 180 + c * 120 + (r === 2 ? 120 : 0), y = 1000 + r * 92, d = A(t, 4.8 + i * .16, 5.2 + i * .16);
    if (t > 4.6) o += SL.kova(x, y, .7, d); }
  if (t > 7.0) o += grp(AU.cip('= 19 KOVA', 0, 0, '#FFFFFF', '#1B2440', 40), 540, 1540, pop(t, 7.0));
  o += gubi(t, { x: 920, y: 1580, boy: 140, duygu: 'merak', bakHedef: [540, 1120] }) + semsiye(920, 1460, .9);
  o += gufi(t, { x: 170, y: 1770, boy: 190, duygu: 'saskin', bakHedef: [540, 600] });
  $('dinamik').innerHTML = kam(o, { y: 900, k: 1.06 - .06 * E(A(t, 0, 8.6)) });
};
</script>
<script src="../ortak/kanal.js"></script>
</body></html>
